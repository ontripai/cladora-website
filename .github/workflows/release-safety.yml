name: Release safety boundaries
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/layout/AppOrMarketingLayout.tsx'
      - 'src/components/customer/CustomerBuildingSetupWizard.tsx'
      - 'src/components/customer/WorkOrderLifecyclePanel.tsx'
      - 'src/app/**/demo/**'
      - 'src/lib/auth/**'
      - 'src/lib/supabase/server-env.ts'
      - 'src/lib/security/turnstile-server.ts'
      - 'scripts/test-release-*.mjs'
      - 'scripts/check-database-package.mjs'
      - 'scripts/lib/database-test-accounting.mjs'
      - 'scripts/test-database-test-accounting.mjs'
      - 'scripts/test-work-order-checklist.mjs'
      - 'scripts/test-work-order-checklist-ui-recovery.mjs'
      - 'scripts/test-work-order-lifecycle-ui.mjs'
      - 'scripts/test-maintenance-dashboard-context-ui.mjs'
      - 'scripts/test-documents-service-role-acl-cleanup-v1.mjs'
      - 'scripts/lib/local-supabase-failure-summary.mjs'
      - 'scripts/summarize-local-supabase-failure.mjs'
      - 'scripts/test-local-supabase-failure-summary.mjs'
      - '.github/workflows/release-safety.yml'
permissions:
  contents: read
jobs:
  safety-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/test-release-demo-isolation.mjs
      - run: node scripts/test-database-test-accounting.mjs
      - run: node scripts/test-local-supabase-failure-summary.mjs
      - run: node scripts/check-database-package.mjs
      - run: node scripts/test-work-order-checklist.mjs
      - run: node scripts/test-work-order-lifecycle-ui.mjs
      - run: node scripts/test-maintenance-dashboard-context-ui.mjs
      - run: node scripts/test-documents-service-role-acl-cleanup-v1.mjs
      - run: node --no-warnings --experimental-strip-types scripts/test-password-recovery-security.mjs
      - run: node --no-warnings --experimental-strip-types scripts/test-public-apis.mjs
      - run: node scripts/test-release-checklist-composition.mjs
      - run: node scripts/test-release-summary-composition.mjs --receipt-only
      - run: node scripts/test-release-assets-composition.mjs --classification-only
      - run: npm run typecheck
