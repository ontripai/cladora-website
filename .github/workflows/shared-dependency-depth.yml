name: Shared dependency depth guard

on:
  pull_request:
    paths:
      - 'patches/**'
      - 'scripts/*braces-depth-guard.mjs'
      - 'scripts/*shared-dependency-audit.mjs'
      - 'scripts/fixtures/braces-audit-report-20261003.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/shared-dependency-depth.yml'
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - 'scripts/*braces-depth-guard.mjs'
      - 'scripts/*shared-dependency-audit.mjs'
      - 'scripts/fixtures/braces-audit-report-20261003.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/shared-dependency-depth.yml'

permissions:
  contents: read

jobs:
  depth-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:dependency-depth
      - run: node scripts/test-shared-dependency-audit.mjs
      - run: git diff --check
