      - name: Run SERVICE subject-link isolated HTTP and real local AAL2 integration
        run: |
          set -euo pipefail
          SOURCE_PG_IMAGE=$(docker inspect --format '{{.Config.Image}}' supabase_db_cladora-local)
          if [ -z "$SOURCE_PG_IMAGE" ]; then
            echo "::error::Supabase PostgreSQL image could not be resolved"
            exit 1
          fi
          if docker inspect cladora-service-http-postgres >/dev/null 2>&1; then
            echo "::error::SERVICE fixture container already exists; refusing to replace it"
            exit 1
          fi
          cleanup_service_postgres() {
            docker stop cladora-service-http-postgres >/dev/null 2>&1 || true
          }
          trap cleanup_service_postgres EXIT
          docker run --rm -d --name cladora-service-http-postgres \
            -e POSTGRES_PASSWORD=postgres -p 127.0.0.1::5432 "$SOURCE_PG_IMAGE"
          SERVICE_PG_BINDING=$(docker port cladora-service-http-postgres 5432/tcp)
          if [[ ! "$SERVICE_PG_BINDING" =~ ^127\.0\.0\.1:([0-9]+)$ ]]; then
            echo "::error::SERVICE PostgreSQL must publish exactly one loopback port"
            exit 1
          fi
          SERVICE_PG_PORT="${BASH_REMATCH[1]}"
          if (( SERVICE_PG_PORT < 1024 || SERVICE_PG_PORT > 65535 )); then
            echo "::error::SERVICE PostgreSQL published port is invalid"
            exit 1
          fi
          for attempt in $(seq 1 90); do
            first_ready=$(timeout 5s docker exec cladora-service-http-postgres \
              psql -U postgres -d postgres -X -A -t -v ON_ERROR_STOP=1 \
              -c "select 1" 2>/dev/null || true)
            if [ "$first_ready" = "1" ]; then
              sleep 3
              stable_ready=$(timeout 5s docker exec cladora-service-http-postgres \
                psql -U postgres -d postgres -X -A -t -v ON_ERROR_STOP=1 \
                -c "select 1" 2>/dev/null || true)
              if [ "$stable_ready" = "1" ]; then
                break
              fi
            fi
            if [ "$attempt" -eq 90 ]; then
              echo "::error::Disposable SERVICE PostgreSQL did not become ready"
              exit 1
            fi
            sleep 1
          done
          PGTAP_VERSION=$(docker exec cladora-service-http-postgres psql -U postgres -d postgres \
            -X -A -t -v ON_ERROR_STOP=1 \
            -c "select default_version from pg_available_extensions where name='pgtap';")
          if [ -z "$PGTAP_VERSION" ]; then
            echo "::error::Isolated SERVICE PostgreSQL does not provide pgTAP"
            exit 1
          fi
          STATUS_JSON=$(supabase status -o json)
          ANON_KEY=$(echo "$STATUS_JSON" | jq -r '.ANON_KEY // empty')
          SERVICE_ROLE_KEY=$(echo "$STATUS_JSON" | jq -r '.SERVICE_ROLE_KEY // empty')
          if [ -z "$ANON_KEY" ] || [ -z "$SERVICE_ROLE_KEY" ]; then
            echo "::error::Local Supabase keys are required for SERVICE HTTP AAL2 evidence"
            exit 1
          fi
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          SERVICE_SUBJECT_LINK_HTTP_ANON_KEY="$ANON_KEY" \
          SERVICE_SUBJECT_LINK_HTTP_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          SERVICE_SUBJECT_LINK_HTTP_TEST_DATABASE_URL="postgresql://supabase_admin:postgres@127.0.0.1:${SERVICE_PG_PORT}/postgres" \
          timeout 240s npm run test:service-subject-link:http:postgres
        env:
          SERVICE_SUBJECT_LINK_HTTP_EPHEMERAL: "1"
          SERVICE_SUBJECT_LINK_LOCAL_STEP_SU_02_AND_S4: "1"
          SERVICE_SUBJECT_LINK_HTTP_REAL_AAL2_REQUIRED: "1"
