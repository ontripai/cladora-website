          PGTAP_TEMP="$(mktemp -d)"
          cleanup_service_postgres() {
            docker stop cladora-service-http-postgres >/dev/null 2>&1 || true
            rm -f "$PGTAP_TEMP/pgtap.control" "$PGTAP_TEMP/pgtap.sql"
            rmdir "$PGTAP_TEMP" 2>/dev/null || true
          }
          trap cleanup_service_postgres EXIT
          for attempt in $(seq 1 60); do
            docker exec cladora-service-http-postgres pg_isready -U postgres >/dev/null 2>&1 && break
            if [ "$attempt" -eq 60 ]; then
              echo "::error::Disposable SERVICE PostgreSQL did not become ready"
              exit 1
            fi
            sleep 1
          done
          PGTAP_VERSION=$(docker exec supabase_db_cladora-local psql -U postgres -d postgres \
            -X -A -t -v ON_ERROR_STOP=1 \
            -c "select default_version from pg_available_extensions where name='pgtap';")
          SOURCE_PG_SHARE=$(docker exec supabase_db_cladora-local pg_config --sharedir)
          TARGET_PG_SHARE=$(docker exec cladora-service-http-postgres pg_config --sharedir)
          docker cp "supabase_db_cladora-local:$SOURCE_PG_SHARE/extension/pgtap.control" \
            "$PGTAP_TEMP/pgtap.control"
          docker cp "supabase_db_cladora-local:$SOURCE_PG_SHARE/extension/pgtap--$PGTAP_VERSION.sql" \
            "$PGTAP_TEMP/pgtap.sql"
          docker exec --user 0 cladora-service-http-postgres \
            mkdir -p "$TARGET_PG_SHARE/extension"
          docker cp "$PGTAP_TEMP/pgtap.control" \
            cladora-service-http-postgres:/tmp/cladora-pgtap.control
          docker cp "$PGTAP_TEMP/pgtap.sql" \
            cladora-service-http-postgres:/tmp/cladora-pgtap.sql
          docker exec --user 0 cladora-service-http-postgres \
            cp /tmp/cladora-pgtap.control "$TARGET_PG_SHARE/extension/pgtap.control"
          docker exec --user 0 cladora-service-http-postgres \
            cp /tmp/cladora-pgtap.sql "$TARGET_PG_SHARE/extension/pgtap--$PGTAP_VERSION.sql"
          docker exec --user 0 cladora-service-http-postgres chmod 0644 \
            "$TARGET_PG_SHARE/extension/pgtap.control" \
            "$TARGET_PG_SHARE/extension/pgtap--$PGTAP_VERSION.sql"
          STATUS_JSON=$(supabase status -o json)
          ANON_KEY=$(echo "$STATUS_JSON" | jq -r '.ANON_KEY // empty')
          SERVICE_ROLE_KEY=$(echo "$STATUS_JSON" | jq -r '.SERVICE_ROLE_KEY // empty')
