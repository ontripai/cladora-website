  # Preparation only. No execution SHA, environment approval or run lease exists.
  # A separate reviewed execution plan must enable this job AND populate the
  # helper's REVIEWED_EXECUTION_PLAN. Env flags/files cannot grant execution.
  building-setup-core-http:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    environment: building-setup-core-http
    concurrency:
      group: building-setup-core-http-${{ github.run_id }}-${{ github.run_attempt }}
      cancel-in-progress: false
    env:
      # This is source selection only, never proof of execution authorization.
      CLADORA_APPROVED_EXECUTION_SHA: ${{ vars.BUILDING_SETUP_HTTP_EXECUTION_SHA }}
    steps:
      - name: Checkout the actual approved Core branch (no synthetic rename)
        uses: actions/checkout@v4
        with:
          ref: codex/core-building-setup-connected-http
          fetch-depth: 0
          persist-credentials: false
      - name: Require the separately approved exact integrated source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = codex/core-building-setup-connected-http
          [[ "$CLADORA_APPROVED_EXECUTION_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CLADORA_APPROVED_EXECUTION_SHA"
          git merge-base --is-ancestor 87ddb06877fb31f562ba66477d14f7bc453a17ee HEAD
          git merge-base --is-ancestor 37115e2a77f4c7e24f2de884cc808706f361dcdb HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - uses: supabase/setup-cli@v3
        with:
          version: 2.84.2
      - name: Platform provisioner and separately delegated Core proof lane
        run: node scripts/provision-building-setup-http-ci.mjs --run
        env:
          # Only read native protected-environment run approvals; not passed to Next/Core.
          GITHUB_TOKEN: ${{ github.token }}
      - name: Require actual final release evidence, including failure/cancellation
        if: always()
        run: node scripts/provision-building-setup-http-ci.mjs --release-evidence
        # Missing/unfinished evidence fails closed. always() does not prove
        # cleanup on runner loss or the workflow's hard timeout/cancellation.
