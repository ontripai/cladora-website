      - "src/lib/core/current-authority-postgres-provider-v1.ts"
      - "src/lib/core/current-authority-transaction-port-v1.ts"
      - "scripts/test-core-authority-revision-postgres-v1.mjs"
      - "scripts/test-core-authority-revision-static.mjs"
      - "scripts/test-documents-reference-authority-v1.mjs"
      - "scripts/test-documents-reference-authority-postgres-v1.mjs"
      - "src/lib/customer/documents-reference-authority-v1.ts"
      - "scripts/test-ce-012-guide-lifecycle-postgres-v1.mjs"
      - "src/lib/community/experience-guide-lifecycle-provider-v1.ts"
      - "scripts/test-documents-workspace-binding-writer-v1.mjs"
      - "scripts/test-documents-workspace-binding-writer-postgres-v1.mjs"
      - "src/lib/customer/documents-workspace-binding-writer-v1.ts"
      - "docs/contracts/CORE-AUTHORITY-REVISION-SOURCES-v1.json"
      - "scripts/lib/ap10-auth-e2e-fixture.mjs"
      - "scripts/lib/ap10-target-identity.mjs"
      - "scripts/test-ap10-auth-e2e-fixture-review-r1.mjs"
      - "scripts/lib/ap10-core-authority-driver.mjs"
      - "scripts/run-ap10-auth-e2e-fixture.mjs"
      - "scripts/test-ap10-auth-e2e-fixture.mjs"
      - "docs/testing/CLADORA-AP10-AUTH-E2E-FIXTURE-v1.0.md"
      - "src/lib/airprop/artifact-b2-read-http-v1.ts"
      - "scripts/test-airprop-gateway-read-http-v1.mjs"
      - "scripts/test-airprop-gateway-read-http-postgres-v1.mjs"
      - "docs/testing/CLADORA-AIRPROP-GATEWAY-READ-HTTP-02-v1.0.md"
      - "scripts/test-statutory-funds-concurrency.mjs"
      - "scripts/test-retention-concurrency-contract.mjs"
      - "scripts/test-retention-manifest-vectors.mjs"
      - "scripts/test-retention-storage-contract.mjs"
      - "scripts/test-retention-operations-dry-run.mjs"
      - "scripts/audit-r10-catalog-evidence.mjs"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm run test:retention

  postgres-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: 2.84.2
      - name: Start clean local database and apply migrations
        run: supabase start
      - name: Run pgTAP database tests
        run: supabase test db
      - name: Setup Node.js for real concurrency tests
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run AIRPROP loopback read gateway contract
        run: npm run test:airprop-gateway-read:http
      - name: Run synthetic AP10 AAL2 and Core authority fixture
        run: |
          set -euo pipefail
          STATUS_JSON=$(supabase status -o json)
          ANON_KEY=$(echo "$STATUS_JSON" | jq -r '.ANON_KEY // empty')
          SERVICE_ROLE_KEY=$(echo "$STATUS_JSON" | jq -r '.SERVICE_ROLE_KEY // empty')
          if [ -z "$ANON_KEY" ] || [ -z "$SERVICE_ROLE_KEY" ]; then
            echo "::error::Local Supabase keys are required for the AP10 fixture"
            exit 1
          fi
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" npm run test:ap10-auth-fixture:runtime
        env:
          CLADORA_AP10_TARGET: local
          CLADORA_AP10_EPHEMERAL_DATABASE: "1"
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Run AIRPROP loopback read gateway with real local Auth and AAL2
        run: |
          set -euo pipefail
          STATUS_JSON=$(supabase status -o json)
          ANON_KEY=$(echo "$STATUS_JSON" | jq -r '.ANON_KEY // empty')
          SERVICE_ROLE_KEY=$(echo "$STATUS_JSON" | jq -r '.SERVICE_ROLE_KEY // empty')
          if [ -z "$ANON_KEY" ] || [ -z "$SERVICE_ROLE_KEY" ]; then
            echo "::error::Local Supabase keys are required for AIRPROP HTTP AAL2 evidence"
            exit 1
          fi
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          AIRPROP_GATEWAY_READ_HTTP_ANON_KEY="$ANON_KEY" \
          AIRPROP_GATEWAY_READ_HTTP_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          timeout 240s npm run test:airprop-gateway-read:http:postgres
        env:
          AIRPROP_GATEWAY_READ_HTTP_EPHEMERAL: "1"
          AIRPROP_GATEWAY_READ_HTTP_REAL_AAL2_REQUIRED: "1"
          AIRPROP_GATEWAY_READ_HTTP_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          AIRPROP_GATEWAY_READ_HTTP_SUPABASE_URL: http://127.0.0.1:54321
      - name: Run canonical authority revision and provider PostgreSQL conformance
        run: timeout 180s npm run test:core-authority-revision:postgres
        env:
          CORE_AUTH_PROVIDER_EPHEMERAL: "1"
          CORE_AUTH_PROVIDER_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Run typed Core TX provider evidence PostgreSQL conformance
        run: timeout 180s npm run test:core-tx-provider-evidence:postgres
        env:
          CORE_TX_EVIDENCE_EPHEMERAL: "1"
          CORE_TX_EVIDENCE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Run Documents reference authority PostgreSQL conformance
        run: timeout 120s npm run test:doc-reference:postgres
        env:
          DOC_REFERENCE_EPHEMERAL: "1"
          DOC_REFERENCE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Run CE Guide lifecycle through the Core transaction host
        run: timeout 120s npm run test:ce-guide-lifecycle:postgres
        env:
          CE_GUIDE_LIFECYCLE_EPHEMERAL: "1"
          CE_GUIDE_LIFECYCLE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Run Documents Workspace binding writer PostgreSQL conformance
        run: npm run test:doc-workspace-writer && timeout 120s npm run test:doc-workspace-writer:postgres
        env:
          DOC_WORKSPACE_WRITER_EPHEMERAL: "1"
          DOC_WORKSPACE_WRITER_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Run Communications message version concurrency regression
        run: timeout 90s npm run test:communications-message-version:postgres
        env:
          COMM_MESSAGE_VERSION_EPHEMERAL: "1"
          COMM_MESSAGE_VERSION_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Run Communications provider through the Core transaction host
        run: timeout 90s npm run test:communications-subject-provider:postgres
        env:
          COMM_MESSAGE_PROVIDER_EPHEMERAL: "1"
          COMM_MESSAGE_PROVIDER_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Run Communications Request audience through the Core transaction host
        run: timeout 120s npm run test:communications-request-audience:postgres
        env:
          COMM_REQUEST_AUDIENCE_EPHEMERAL: "1"
          COMM_REQUEST_AUDIENCE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Run SERVICE Request provider through the Core transaction host
        run: timeout 120s npm run test:service-request-subject-provider:postgres
        env:
          SERVICE_REQUEST_PROVIDER_EPHEMERAL: "1"
          SERVICE_REQUEST_PROVIDER_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Run SERVICE private-message subject link through the Core transaction host
        run: timeout 180s npm run test:service-subject-link:postgres
        env:
          SERVICE_SUBJECT_LINK_EPHEMERAL: "1"
          SERVICE_SUBJECT_LINK_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Run SERVICE subject-link isolated HTTP and real local AAL2 integration
        run: |
          set -euo pipefail
          STATUS_JSON=$(supabase status -o json)
          ANON_KEY=$(echo "$STATUS_JSON" | jq -r '.ANON_KEY // empty')
          SERVICE_ROLE_KEY=$(echo "$STATUS_JSON" | jq -r '.SERVICE_ROLE_KEY // empty')
          if [ -z "$ANON_KEY" ] || [ -z "$SERVICE_ROLE_KEY" ]; then
            echo "::error::Local Supabase keys are required for SERVICE HTTP AAL2 evidence"
            exit 1
          fi
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          SERVICE_SUBJECT_LINK_HTTP_ANON_KEY="$ANON_KEY" \
          SERVICE_SUBJECT_LINK_HTTP_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          timeout 240s npm run test:service-subject-link:http:postgres
        env:
          SERVICE_SUBJECT_LINK_HTTP_EPHEMERAL: "1"
          SERVICE_SUBJECT_LINK_HTTP_REAL_AAL2_REQUIRED: "1"
          SERVICE_SUBJECT_LINK_HTTP_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          SERVICE_SUBJECT_LINK_HTTP_SUPABASE_URL: http://127.0.0.1:54321
      - name: Run Core transaction host PostgreSQL and concurrency conformance
        run: timeout 90s npm run test:core-tx-host:postgres
        env:
          CORE_TX_HOST_EPHEMERAL: "1"
          CORE_TX_HOST_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Run Core exact-replay provider hook PostgreSQL conformance
        run: timeout 90s npm run test:core-tx-replay-hook:postgres
        env:
          CORE_TX_REPLAY_HOOK_EPHEMERAL: "1"
          CORE_TX_REPLAY_HOOK_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Run independent Core relationship review race
        run: timeout 60s node scripts/test-core-relationship-concurrency.mjs
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Run real multi-connection financial close concurrency tests
        run: timeout 60s node scripts/test-financial-close-concurrency.mjs
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Run real multi-connection workspace taxonomy concurrency tests
        run: timeout 60s node scripts/test-workspace-taxonomy-concurrency.mjs
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Run real multi-connection workspace taxonomy mutation concurrency tests
        run: timeout 60s node scripts/test-workspace-taxonomy-mutation-concurrency.mjs
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Run real multi-connection workspace module activation concurrency tests
        run: timeout 60s node scripts/test-workspace-module-activation-concurrency.mjs
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Run real multi-connection workspace roles concurrency tests
        run: timeout 60s node scripts/test-workspace-roles-concurrency.mjs
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Run real multi-connection workspace delegations concurrency tests
        run: timeout 60s node scripts/test-workspace-delegations-concurrency.mjs
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Run R10 statutory funds multi-connection concurrency tests
        run: timeout 60s npm run test:statutory-funds:concurrency
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          CLADORA_EPHEMERAL_DB: "1"
      - name: Run R10 cash discipline multi-connection concurrency tests
        run: timeout 60s npm run test:cash-discipline:concurrency
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          CLADORA_EPHEMERAL_DB: "1"
      - name: Run R10 catalog and Data API evidence gate
        run: |
          set -euo pipefail
          STATUS_JSON=$(supabase status -o json)
          ANON_KEY=$(echo "$STATUS_JSON" | jq -r '.ANON_KEY // empty')
          SERVICE_ROLE_KEY=$(echo "$STATUS_JSON" | jq -r '.SERVICE_ROLE_KEY // empty')
          if [ -z "$ANON_KEY" ] || [ -z "$SERVICE_ROLE_KEY" ]; then
            echo "::error::Local Supabase keys are required for the R10 Data API evidence gate"
            exit 1
          fi
          if [ -n "$ANON_KEY" ]; then echo "::add-mask::$ANON_KEY"; fi
          if [ -n "$SERVICE_ROLE_KEY" ]; then echo "::add-mask::$SERVICE_ROLE_KEY"; fi
          SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" node scripts/audit-r10-catalog-evidence.mjs
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          SUPABASE_URL: http://127.0.0.1:54321
          REQUIRE_DATA_API_EVIDENCE: "true"
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Upload R10 catalog evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r10-catalog-evidence
          path: r10-catalog-evidence.json
          if-no-files-found: ignore
      - name: Run local database security and performance advisors
        run: supabase db lint --local --level warning
      - name: Show service status on failure
        if: failure()
        run: supabase status || true
      - name: Stop ephemeral database
        if: always()
        run: timeout 60s supabase stop --no-backup
