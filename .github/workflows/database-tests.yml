name: Database tests

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/database-tests.yml"
      - "scripts/check-database-package.mjs"
      - "scripts/test-financial-close-concurrency.mjs"
      - "scripts/test-workspace-taxonomy-concurrency.mjs"
      - "scripts/test-workspace-taxonomy-mutation-concurrency.mjs"
      - "scripts/test-workspace-module-activation-concurrency.mjs"
      - "scripts/audit-r10-catalog-evidence.mjs"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/database-tests.yml"
      - "scripts/check-database-package.mjs"
      - "scripts/test-financial-close-concurrency.mjs"
      - "scripts/test-workspace-taxonomy-concurrency.mjs"
      - "scripts/test-workspace-taxonomy-mutation-concurrency.mjs"
      - "scripts/test-workspace-module-activation-concurrency.mjs"
      - "scripts/audit-r10-catalog-evidence.mjs"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: node scripts/check-database-package.mjs

  postgres-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: 2.84.2
      - name: Start clean local database and apply migrations
        run: supabase start
      - name: Run pgTAP database tests
        run: supabase test db
      - name: Setup Node.js for real concurrency tests
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run real multi-connection financial close concurrency tests
        run: timeout 60s node scripts/test-financial-close-concurrency.mjs
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Run real multi-connection workspace taxonomy concurrency tests
        run: timeout 60s node scripts/test-workspace-taxonomy-concurrency.mjs
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Run real multi-connection workspace taxonomy mutation concurrency tests
        run: timeout 60s node scripts/test-workspace-taxonomy-mutation-concurrency.mjs
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Run real multi-connection workspace module activation concurrency tests
        run: timeout 60s node scripts/test-workspace-module-activation-concurrency.mjs
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Run real multi-connection workspace roles concurrency tests
        run: timeout 60s node scripts/test-workspace-roles-concurrency.mjs
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Run real multi-connection workspace delegations concurrency tests
        run: timeout 60s node scripts/test-workspace-delegations-concurrency.mjs
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Run R10 catalog and Data API evidence gate
        run: |
          set -euo pipefail
          STATUS_JSON=$(supabase status -o json)
          ANON_KEY=$(echo "$STATUS_JSON" | jq -r '.ANON_KEY // empty')
          SERVICE_ROLE_KEY=$(echo "$STATUS_JSON" | jq -r '.SERVICE_ROLE_KEY // empty')
          if [ -z "$ANON_KEY" ] || [ -z "$SERVICE_ROLE_KEY" ]; then
            echo "::error::Local Supabase keys are required for the R10 Data API evidence gate"
            exit 1
          fi
          if [ -n "$ANON_KEY" ]; then echo "::add-mask::$ANON_KEY"; fi
          if [ -n "$SERVICE_ROLE_KEY" ]; then echo "::add-mask::$SERVICE_ROLE_KEY"; fi
          SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" node scripts/audit-r10-catalog-evidence.mjs
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          SUPABASE_URL: http://127.0.0.1:54321
          REQUIRE_DATA_API_EVIDENCE: "true"
      - name: Upload R10 catalog evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r10-catalog-evidence
          path: r10-catalog-evidence.json
          if-no-files-found: ignore
      - name: Run local database security and performance advisors
        run: supabase db lint --local --level warning
      - name: Show service status on failure
        if: failure()
        run: supabase status || true
      - name: Stop ephemeral database
        if: always()
        run: timeout 60s supabase stop --no-backup
