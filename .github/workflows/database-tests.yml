permissions:
  contents: read

concurrency:
  group: database-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:retention
      - run: npm run test:documents-country-retention-resolution
      - run: npm run test:documents-country-retention-operation

  postgres-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: 2.84.2
      - name: Start clean local database with staged SERVICE S4 gate
        run: bash scripts/start-local-supabase-staged-service-s4.sh start
        env:
          CLADORA_LOCAL_STEP_SU_02_AUTHORIZED: "1"
      - name: Run pgTAP database tests
        run: supabase test db
      - name: Setup Node.js for real concurrency tests
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run AIRPROP loopback read gateway contract
        run: npm run test:airprop-gateway-read:http
      - name: Run synthetic AP10 AAL2 and Core authority fixture
        run: |
          set -euo pipefail
          STATUS_JSON=$(supabase status -o json)
          ANON_KEY=$(echo "$STATUS_JSON" | jq -r '.ANON_KEY // empty')
          SERVICE_ROLE_KEY=$(echo "$STATUS_JSON" | jq -r '.SERVICE_ROLE_KEY // empty')
          if [ -z "$ANON_KEY" ] || [ -z "$SERVICE_ROLE_KEY" ]; then
            echo "::error::Local Supabase keys are required for the AP10 fixture"
            exit 1
          fi
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" npm run test:ap10-auth-fixture:runtime
        env:
          CLADORA_AP10_TARGET: local
          CLADORA_AP10_EPHEMERAL_DATABASE: "1"
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Run AIRPROP loopback read gateway with real local Auth and AAL2
        run: |
          set -euo pipefail
          STATUS_JSON=$(supabase status -o json)
          ANON_KEY=$(echo "$STATUS_JSON" | jq -r '.ANON_KEY // empty')
          SERVICE_ROLE_KEY=$(echo "$STATUS_JSON" | jq -r '.SERVICE_ROLE_KEY // empty')
          if [ -z "$ANON_KEY" ] || [ -z "$SERVICE_ROLE_KEY" ]; then
            echo "::error::Local Supabase keys are required for AIRPROP HTTP AAL2 evidence"
            exit 1
          fi
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          AIRPROP_GATEWAY_READ_HTTP_ANON_KEY="$ANON_KEY" \
          AIRPROP_GATEWAY_READ_HTTP_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          timeout 240s npm run test:airprop-gateway-read:http:postgres
        env:
          AIRPROP_GATEWAY_READ_HTTP_EPHEMERAL: "1"
          AIRPROP_GATEWAY_READ_HTTP_REAL_AAL2_REQUIRED: "1"
          AIRPROP_GATEWAY_READ_HTTP_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          AIRPROP_GATEWAY_READ_HTTP_SUPABASE_URL: http://127.0.0.1:54321
      - name: Run canonical authority revision and provider PostgreSQL conformance
        run: timeout 180s npm run test:core-authority-revision:postgres
        env:
          CORE_AUTH_PROVIDER_EPHEMERAL: "1"
          CORE_AUTH_PROVIDER_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Run current unit-to-property selector PostgreSQL conformance
        run: npm run test:core-current-unit-property-selector && timeout 180s npm run test:core-current-unit-property-selector:postgres
        env:
          CORE_UNIT_PROPERTY_SELECTOR_EPHEMERAL: "1"
          CORE_UNIT_PROPERTY_SELECTOR_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Run current property jurisdiction profile selector PostgreSQL conformance
        run: npm run test:core-jurisdiction-profile-selector && timeout 180s npm run test:core-jurisdiction-profile-selector:postgres
        env:
          CORE_JURISDICTION_SELECTOR_EPHEMERAL: "1"
          CORE_JURISDICTION_SELECTOR_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Run immutable jurisdiction domain artifact resolver PostgreSQL conformance
        run: npm run test:core-jurisdiction-domain-artifact-resolver && timeout 180s npm run test:core-jurisdiction-domain-artifact-resolver:postgres
        env:
          CORE_JURISDICTION_ARTIFACT_RESOLVER_EPHEMERAL: "1"
          CORE_JURISDICTION_ARTIFACT_RESOLVER_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Run Documents country retention resolution PostgreSQL conformance
        run: timeout 180s npm run test:documents-country-retention-resolution:postgres
        env:
          DOCUMENTS_COUNTRY_RETENTION_RESOLUTION_EPHEMERAL: "1"
