permissions:
  contents: read

concurrency:
  group: database-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Offline Building Setup CI binding controls (no runtime)
        run: node --test scripts/test-building-setup-http-ci-provisioner.mjs
      - run: npm run test:retention
      - run: npm run test:documents-country-retention-resolution
      - run: npm run test:documents-country-retention-operation

  postgres-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: supabase/setup-cli@v3
        with:
          version: 2.84.2
      - name: Acquire fresh CI-only Building Setup runtime lease
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(docker ps -aq)"
          test -z "$(docker volume ls -q)"
          echo 'BUILDING_SETUP_CI_OWNS_FRESH_DAEMON=1' >> "$GITHUB_ENV"
          echo "BUILDING_SETUP_TEST_LEASE=building-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          supabase start --help
          supabase test db --help
          supabase stop --help
      - name: Start clean local database with staged SERVICE S4 gate
        run: bash scripts/start-local-supabase-staged-service-s4.sh start
        env:
          CLADORA_LOCAL_STEP_SU_02_AUTHORIZED: "1"
      - name: Run pgTAP database tests
        run: supabase test db
      - name: Setup Node.js for real concurrency tests
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run integrated Building Setup source, API and mounted regressions
        run: |
          node scripts/test-building-setup-integration.mjs
          node scripts/test-building-workspace-onboarding-api.mjs
          node scripts/test-building-workspace-onboarding-ui.mjs
      - name: Prove Building Setup concurrent commands in an owned synthetic clone
        run: node scripts/run-building-setup-concurrency-ci.mjs
      - name: Run AIRPROP loopback read gateway contract
        run: npm run test:airprop-gateway-read:http
      - name: Run synthetic AP10 AAL2 and Core authority fixture
        run: |
          set -euo pipefail
          STATUS_JSON=$(supabase status -o json)
          ANON_KEY=$(echo "$STATUS_JSON" | jq -r '.ANON_KEY // empty')
          SERVICE_ROLE_KEY=$(echo "$STATUS_JSON" | jq -r '.SERVICE_ROLE_KEY // empty')
          if [ -z "$ANON_KEY" ] || [ -z "$SERVICE_ROLE_KEY" ]; then
            echo "::error::Local Supabase keys are required for the AP10 fixture"
            exit 1
          fi
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" npm run test:ap10-auth-fixture:runtime
        env:
          CLADORA_AP10_TARGET: local
          CLADORA_AP10_EPHEMERAL_DATABASE: "1"
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Run AIRPROP loopback read gateway with real local Auth and AAL2
        run: |
          set -euo pipefail
          STATUS_JSON=$(supabase status -o json)
          ANON_KEY=$(echo "$STATUS_JSON" | jq -r '.ANON_KEY // empty')
          SERVICE_ROLE_KEY=$(echo "$STATUS_JSON" | jq -r '.SERVICE_ROLE_KEY // empty')
          if [ -z "$ANON_KEY" ] || [ -z "$SERVICE_ROLE_KEY" ]; then
            echo "::error::Local Supabase keys are required for AIRPROP HTTP AAL2 evidence"
            exit 1
          fi
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          AIRPROP_GATEWAY_READ_HTTP_ANON_KEY="$ANON_KEY" \
