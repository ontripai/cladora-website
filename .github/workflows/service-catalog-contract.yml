name: SERVICE catalogue contract
on:
  pull_request:
    paths:
      - 'src/lib/customer/service-quote-schema.ts'
      - 'scripts/test-service-quote-contract-013.mjs'
      - 'src/lib/customer/service-request-schema.ts'
      - 'scripts/test-service-request-contract-009.mjs'
      - 'src/lib/customer/service-catalog-schema.ts'
      - 'src/lib/customer/service-offering-v14-schema.ts'
      - 'src/lib/customer/service-order-acceptance-v14-schema.ts'
      - 'src/lib/customer/service-collaboration-v14-schema.ts'
      - 'src/lib/customer/service-delivery-v14-schema.ts'
      - 'src/lib/customer/service-booking-v14-schema.ts'
      - 'src/components/customer/ServiceResourcePicker.tsx'
      - 'src/lib/customer/service-offering-lifecycle.ts'
      - 'src/lib/customer/service-catalog-projection.ts'
      - 'src/lib/customer/service-catalog-retry.ts'
      - 'src/lib/customer/workspace-composition-schema.ts'
      - 'src/config/currencies.ts'
      - 'src/config/locales.ts'
      - 'scripts/test-service-catalog-contract-001.mjs'
      - 'scripts/test-service-offering-v14-contract.mjs'
      - 'scripts/test-service-order-acceptance-v14-contract.mjs'
      - 'scripts/test-service-collaboration-v14-contract.mjs'
      - 'scripts/test-service-delivery-v14-contract.mjs'
      - 'scripts/test-service-booking-v14-contract.mjs'
      - 'scripts/test-service-resource-picker-v14.mjs'
      - '.github/workflows/service-catalog-contract.yml'
      - 'package.json'
      - 'package-lock.json'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/test-service-catalog-contract-001.mjs
      - run: node scripts/test-service-request-contract-009.mjs
      - run: node scripts/test-service-quote-contract-013.mjs
      - run: npm run test:service-v14
      - run: node scripts/test-service-resource-picker-v14.mjs
      - run: npx eslint src/lib/customer/service-quote-schema.ts scripts/test-service-quote-contract-013.mjs --max-warnings=0
      - run: npx eslint src/lib/customer/service-request-schema.ts scripts/test-service-request-contract-009.mjs --max-warnings=0
      - run: npx eslint src/lib/customer/service-catalog-schema.ts src/lib/customer/service-offering-lifecycle.ts src/lib/customer/service-catalog-projection.ts src/lib/customer/service-catalog-retry.ts scripts/test-service-catalog-contract-001.mjs --max-warnings=0
      - run: npx eslint src/lib/customer/service-offering-v14-schema.ts scripts/test-service-offering-v14-contract.mjs --max-warnings=0
      - run: npx eslint src/lib/customer/service-order-acceptance-v14-schema.ts scripts/test-service-order-acceptance-v14-contract.mjs --max-warnings=0
      - run: npx eslint src/lib/customer/service-collaboration-v14-schema.ts scripts/test-service-collaboration-v14-contract.mjs --max-warnings=0
      - run: npx eslint src/lib/customer/service-delivery-v14-schema.ts scripts/test-service-delivery-v14-contract.mjs --max-warnings=0
      - run: npx eslint src/lib/customer/service-booking-v14-schema.ts scripts/test-service-booking-v14-contract.mjs --max-warnings=0
      - run: npx eslint src/components/customer/ServiceResourcePicker.tsx scripts/test-service-resource-picker-v14.mjs --max-warnings=0

      - run: npm run typecheck
      - run: npm run test:unit
