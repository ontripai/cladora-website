name: SERVICE catalogue contract
on:
  pull_request:
    paths:
      - 'src/lib/customer/service-catalog-schema.ts'
      - 'src/lib/customer/service-offering-lifecycle.ts'
      - 'src/lib/customer/workspace-composition-schema.ts'
      - 'scripts/test-service-catalog-contract-001.mjs'
      - '.github/workflows/service-catalog-contract.yml'
      - 'package.json'
      - 'package-lock.json'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/test-service-catalog-contract-001.mjs
      - run: npx tsc --noEmit --strict --skipLibCheck --esModuleInterop --target es2022 --module commonjs src/lib/customer/service-catalog-schema.ts src/lib/customer/service-offering-lifecycle.ts
      - run: npx eslint src/lib/customer/service-catalog-schema.ts src/lib/customer/service-offering-lifecycle.ts scripts/test-service-catalog-contract-001.mjs --max-warnings=0

      - run: npm run typecheck
      - run: npm run test:unit
