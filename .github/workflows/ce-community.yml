name: CE Community
on:
  pull_request:
    paths:
      - 'src/lib/community/community-base-*.ts'
      - 'src/lib/community/experience-guide-*.ts'
      - 'src/app/api/customer/v1/community/base/**'
      - 'src/app/*/app/community/**'
      - 'src/components/customer/CustomerCommunityBase*.tsx'
      - 'src/app/api/customer/v1/experience/guides/**'
      - 'src/app/*/app/experience/guides/**'
      - 'src/components/customer/CustomerExperienceGuide*.tsx'
      - 'src/app/api/customer/v1/community/events/**'
      - 'src/app/*/app/community/events/**'
      - 'src/components/customer/CustomerEventInterest*.tsx'
      - 'src/components/customer/CustomerAppShell.tsx'
      - 'src/lib/community/event-interest-*.ts'
      - 'src/lib/community/service-experience-coordination-receipt.ts'
      - 'src/lib/customer/access-matrix.ts'
      - 'src/lib/customer/route-classifier.ts'
      - 'supabase/proposals/ce_010_community_operational_v1.sql'
      - 'supabase/proposals/ce_012_experience_guide_operational_v1.sql'
      - 'supabase/migrations/*_experience_guide_storage_lifecycle_v1.sql'
      - 'supabase/proposals/ce_011_event_interest_operational_v1.sql'
      - 'supabase/tests/173_ce_010_community_proposal.test.sql'
      - 'supabase/tests/174_ce_012_experience_guide_proposal.test.sql'
      - 'supabase/tests/172_ce_011_event_interest_proposal.test.sql'
      - 'supabase/tests/fixtures/ce_010_*.inc'
      - 'supabase/tests/fixtures/ce_012_*.inc'
      - 'supabase/tests/fixtures/ce_011_*.inc'
      - 'scripts/test-ce-010-*.mjs'
      - 'scripts/test-ce-012-*.mjs'
      - 'scripts/test-ce-guide-lifecycle-http-*.mjs'
      - 'scripts/test-core-platform-role-bound-pool-*.mjs'
      - 'src/lib/core/platform-role-bound-pool-v1.ts'
      - 'supabase/migrations/*_core_platform_role_bound_pool_v1.sql'
      - 'supabase/tests/184_core_platform_role_bound_pool.test.sql'
      - 'scripts/test-ce-011-*.mjs'
      - 'scripts/test-ce-service-experience-coordination-receipt.mjs'
      - 'docs/architecture/CLADORA-CE-SV01N-PROVIDER-CONTRACT-v1.0.md'
      - '.github/workflows/ce-community.yml'
permissions:
  contents: read
concurrency:
  group: ce-community-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ce010-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: CE010, CE011 and CE012 domain and HTTP boundary
        run: |
          node --experimental-strip-types scripts/test-ce-010-community-base.mjs
          node scripts/test-ce-010-route.mjs
          node --experimental-strip-types scripts/test-ce-010-community-page.mjs
          node --experimental-strip-types scripts/test-ce-012-experience-guide.mjs
          node scripts/test-ce-012-route.mjs
          node --experimental-strip-types scripts/test-ce-012-guide-page.mjs
          node scripts/test-ce-012-form-recovery.mjs
          node scripts/test-ce-011-form-recovery.mjs
          node --experimental-strip-types scripts/test-ce-011-event-interest.mjs
          node scripts/test-ce-011-route.mjs
          node scripts/test-ce-011-operational-package.mjs
          node --experimental-strip-types scripts/test-ce-011-event-page.mjs
          node scripts/test-ce-010-form-feedback.mjs
          npm run test:ce:service-experience-provider
      - uses: supabase/setup-cli@v3
        with:
          version: 2.84.2
      - name: Start disposable local Supabase
        run: supabase start
      - name: Real CE multi-connection races
        run: |
          timeout 90s node scripts/test-ce-010-concurrency.mjs
          timeout 120s npm run test:ce-guide-lifecycle:postgres
        env:
          CLADORA_EPHEMERAL_DB: '1'
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          CE_GUIDE_LIFECYCLE_EPHEMERAL: '1'
          CE_GUIDE_LIFECYCLE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Inactive Guide handler with local Auth, TOTP and Core TX host
        run: |
          set -euo pipefail
          STATUS_JSON=$(supabase status -o json)
          ANON_KEY=$(echo "$STATUS_JSON" | jq -r '.ANON_KEY // empty')
          SERVICE_ROLE_KEY=$(echo "$STATUS_JSON" | jq -r '.SERVICE_ROLE_KEY // empty')
          if [ -z "$ANON_KEY" ] || [ -z "$SERVICE_ROLE_KEY" ]; then
            echo "::error::Local Supabase keys are required for CE Guide HTTP AAL2 evidence"
            exit 1
          fi
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          npm run test:ce-guide-lifecycle:http
          CE_GUIDE_LIFECYCLE_HTTP_ANON_KEY="$ANON_KEY" \
          CE_GUIDE_LIFECYCLE_HTTP_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          timeout 240s npm run test:ce-guide-lifecycle:http:postgres
        env:
          CE_GUIDE_LIFECYCLE_HTTP_EPHEMERAL: '1'
          CE_GUIDE_LIFECYCLE_HTTP_REAL_AAL2_REQUIRED: '1'
          CE_GUIDE_LIFECYCLE_HTTP_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          CE_GUIDE_LIFECYCLE_HTTP_SUPABASE_URL: http://127.0.0.1:54321
      - name: Stop disposable local Supabase
        if: always()
        run: supabase stop --no-backup
