name: AIRPROP commercial contracts v1.4
on:
  pull_request:
    paths:
      - 'src/lib/airprop/commercial-lifecycle-v1.ts'
      - 'scripts/test-airprop-commercial-contracts-v14.mjs'
      - 'docs/airprop/**'
      - '.github/workflows/airprop-commercial-contracts-v14.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/test-airprop-commercial-contracts-v14.mjs
      - run: npm run typecheck
      - run: npm run lint
