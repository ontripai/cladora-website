name: Application Foundation

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/test-supabase-foundation.mjs'
      - 'scripts/test-occupancy-unit-registry-route.mjs'
      - 'scripts/test-braces-depth-security.mjs'
      - 'scripts/test-ce-member-benefit-terminology-audit-v1.mjs'
      - 'docs/architecture/CLADORA-CE-MEMBER-BENEFIT-TERMINOLOGY-AUDIT-04-v1.0.md'
      - 'docs/architecture/references/CLADORA-CE-MEMBER-BENEFIT-TERMINOLOGY-AUDIT-04-INVENTORY.json'
      - 'docs/architecture/references/CLADORA-CE-MEMBER-BENEFIT-TERMINOLOGY-AUDIT-04-EVIDENCE.json'
      - 'vendor/**'
      - 'patches/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.mjs'
      - 'eslint.config.mjs'
      - '.env.example'
      - '.github/workflows/application-foundation.yml'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'scripts/test-supabase-foundation.mjs'
      - 'scripts/test-occupancy-unit-registry-route.mjs'
      - 'scripts/test-braces-depth-security.mjs'
      - 'scripts/test-ce-member-benefit-terminology-audit-v1.mjs'
      - 'docs/architecture/CLADORA-CE-MEMBER-BENEFIT-TERMINOLOGY-AUDIT-04-v1.0.md'
      - 'docs/architecture/references/CLADORA-CE-MEMBER-BENEFIT-TERMINOLOGY-AUDIT-04-INVENTORY.json'
      - 'docs/architecture/references/CLADORA-CE-MEMBER-BENEFIT-TERMINOLOGY-AUDIT-04-EVIDENCE.json'
      - 'vendor/**'
      - 'patches/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.mjs'
      - 'eslint.config.mjs'
      - '.env.example'
      - '.github/workflows/application-foundation.yml'

permissions:
  contents: read

jobs:
  application-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run test:ce:member-benefit-terminology
      - run: npm run test:unit
      - run: npm run test:core-jurisdiction-profile
      - run: npm run test:core-jurisdiction-domain-artifact
      - run: npm run test:core-jurisdiction-domain-artifact-resolver
      - run: npm run test:airprop-b2
      - run: npm run test:app-foundation
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Run three-language audit against the built app
        run: |
          npm run start > /tmp/cladora-next.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID"' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/en/login > /dev/null; then
              npm run test:i18n
              exit 0
            fi
            sleep 1
          done

          cat /tmp/cladora-next.log
          exit 1
      - run: git diff --check
