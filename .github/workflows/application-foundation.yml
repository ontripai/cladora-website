permissions:
  contents: read

jobs:
  application-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v5
        with:
          # Core coupling fixtures read sealed historical modules by full SHA.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - name: Authenticated shell source and exact local font licenses (static only)
        run: node scripts/test-authenticated-app-07.mjs
      - name: Integrated SERVICE shell and genuine Core denial (controlled; not native browser)
        run: |
          node scripts/test-real-authenticated-service-08.mjs
          node scripts/test-context-denial-regression-02.mjs
          node scripts/test-reviewer-workspace-routing.mjs
      - name: Preserve Core15 checkpoint identities at their reviewed source revision
        run: |
          checkpoint=29ed18541c602dae4e6db5c98a96201250af630b
          git diff --exit-code "$checkpoint" HEAD -- \
            supabase/install/core-functional-runtime-v1/manifest.json \
            supabase/install/core-functional-runtime-v1/service-native-v3/service-cut.manifest.json \
            docs/verification/CORE15-SERVICE-CUT-580de7.manifest.json \
            docs/verification/CORE15-SESSION-a0a37.manifest.json
          checkpoint_dir="$RUNNER_TEMP/cladora-core15-checkpoint-29ed185"
          git worktree add --detach "$checkpoint_dir" "$checkpoint"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$checkpoint_dir/node_modules"
          cleanup_checkpoint() {
            rm "$checkpoint_dir/node_modules"
            git worktree remove "$checkpoint_dir"
          }
          trap cleanup_checkpoint EXIT
          (
            cd "$checkpoint_dir"
            node scripts/test-core-functional-install-packet-v1.mjs
            node scripts/test-core15-integration-lineage-v1.mjs
            node scripts/check-core15-service-cut-v1.mjs
          )
      - name: Integrated Core session and command source (controlled; no native execution)
        run: |
          node scripts/test-core-functional-runtime-v1.mjs
          node scripts/test-core15-session-source-v1.mjs
          node scripts/test-core15-service-cut-v1.mjs
          node scripts/test-service-functional-request-runtime-binding-v1.mjs
          node scripts/test-service-s01-consumer-sqlstate-v1.mjs
          node scripts/test-core-installer-credential-binding-17.mjs
          node scripts/test-core-service-assembly-review-r1.mjs
          node scripts/test-core-service-app-assembly-17.mjs
          node scripts/check-core-service-assembly-17.mjs
      - name: Inactive Operations and Platform source (offline; no ACL or target changes)
        run: |
          python -B scripts/review-ops-populated-transition-01a/test.py
          python -B scripts/review-ops-populated-transition-01a/acl-projection-02/test_packet.py
          python -B scripts/test-functional-dev-stack-v1.py
          python -B scripts/test-functional-dev-restore13.py
          python -B scripts/test-storage-documents-native-preflight-v1.py
          python -B scripts/test-storage-documents-abi15-r1.py
          python -B scripts/test-storage-acl-recovery-r2.py
          node scripts/test-storage-documents-abi15-r1.mjs
          node scripts/test-storage-documents-abi15-capture-r1.mjs
          python -B scripts/service-consumer-rehearsal-17/test_lane.py
          python -B scripts/service-consumer-rehearsal-17/test_continuation.py
          node scripts/service-consumer-rehearsal-17/test_api_continuation.mjs
      - run: npm run test:ce:member-benefit-terminology
      - run: npm run test:ce:benefit-ownership-reconciliation
      - run: npm run test:ce:benefit-presentation-handoff
      - run: npm run test:unit
      - name: Contact intake retention (real handler, controlled persistence and notifier)
        run: node scripts/test-contact-intake-retention.mjs
      - name: Contact canonical fingerprint and unchanged pilot vectors
        run: node scripts/test-contact-fingerprint.mjs
      - name: Mobile consumer guards (mocked Auth/HTTP, no connected DB)
        run: npm run test:mobile-consumer-guards
      - run: npm run test:core-jurisdiction-profile
      - run: npm run test:core-canonical-country-registry
      - run: npm run test:core-jurisdiction-domain-artifact
      - run: npm run test:core-jurisdiction-domain-artifact-resolver
      - run: npm run test:airprop-b2
      - run: npm run test:airprop-address-presentation
      - run: npm run test:app-foundation
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Run three-language audit against the built app
        run: |
          npm run start > /tmp/cladora-next.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID"' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/en/login > /dev/null; then
              npm run test:i18n
              exit 0
            fi
            sleep 1
          done

          cat /tmp/cladora-next.log
          exit 1
      - run: git diff --check
